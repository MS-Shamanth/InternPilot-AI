# Render Blueprint: FastAPI backend (Docker) + PostgreSQL 16, free tier.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: internpilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: internpilot-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Set to your Vercel URL, e.g. https://internpilot-ai.vercel.app (no trailing slash).
      - key: CORS_ORIGINS
        sync: false
      - key: DEMO_USER_EMAIL
        value: demo@internpilot.dev
      - key: LLM_ENABLED
        value: "false"

databases:
  - name: internpilot-db
    plan: free
    databaseName: internpilot
    user: internpilot
    postgresMajorVersion: "16"