# Alembic configuration (design.md §4.3).
# The database URL is NOT stored here: alembic/env.py reads DATABASE_URL through app Settings.
# Override for one run with: alembic -x db_url=<url> upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
